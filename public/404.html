<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found</title>
    <script>
      var isGitHubPages = window.location.hostname.endsWith('.github.io');
      var repository = window.location.pathname.split('/')[1];
      var basePath = isGitHubPages && repository ? '/' + repository + '/' : '/';
      window.location.replace(window.location.origin + basePath);
    </script>
  </head>
  <body>
    <p>Returning to the website…</p>
  </body>
</html>
